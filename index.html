<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BetPanel · 包廂熱場投注</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDK compat -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
    
    <!-- Core App Engine -->
    <script src="app.js"></script>
</head>
<body>

    <header class="board-header">
        <div class="title-block">
            <div class="eyebrow">BetPanel</div>
            <h1>包廂熱場<span class="accent">投注站</span></h1>
        </div>
        <div class="conn-status" id="connStatus">
            <span class="conn-dot"></span> 連線中...
        </div>
    </header>

    <main class="container">
        
        <!-- Room Entry Section -->
        <section class="room-entry" id="roomEntrySection" style="display: none;">
            <div class="card">
                <h2 class="card-title">加入包廂</h2>
                <div class="input-group">
                    <label>輸入 6 碼包廂代碼</label>
                    <input type="text" id="roomCodeInput" class="room-code-input text-center" maxlength="6" placeholder="例如: ABCDEF" autocomplete="off" style="text-transform: uppercase; font-family: 'JetBrains Mono', monospace; font-size: 2rem; letter-spacing: 0.2em;">
                </div>
                <button class="btn btn-primary room-join-btn w-100" id="joinRoomBtn">進入包廂</button>
                <div class="mt-3 text-center text-sm text-dim">
                    <p>或掃描包廂 QR Code 自動加入</p>
                </div>
            </div>
        </section>

        <!-- Main Betting Area (Hidden until room joined) -->
        <div id="mainAppSection" style="display: none;">
            
            <!-- Identity & Stats Section -->
            <section class="identity-section card mb-3">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h3 class="m-0">我的身分</h3>
                    <div class="text-sm text-dim">包廂: <span id="currentRoomDisplay" class="font-mono accent"></span> <button class="btn btn-sm btn-outline ml-2" onclick="leaveRoom()">離開</button></div>
                </div>
                <div class="input-group mb-3">
                    <input type="text" id="nicknameInput" placeholder="輸入您的暱稱..." autocomplete="off">
                </div>
                
                <div class="personal-stats summary-strip">
                    <div class="stat-box">
                        <div class="stat-label">總投注次數</div>
                        <div class="stat-value" id="myBetCount">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">總下注額</div>
                        <div class="stat-value" id="myTotalStaked">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">已結算損益</div>
                        <div class="stat-value" id="mySettledPnL">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">未結算額度</div>
                        <div class="stat-value text-dim" id="myPendingAmount">0</div>
                    </div>
                </div>
            </section>

            <!-- Room Summary Strip -->
            <section class="room-summary summary-strip mb-3">
                <div class="stat-box">
                    <div class="stat-label">開放中盤口</div>
                    <div class="stat-value text-accent" id="roomOpenMarkets">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">總彩池金額</div>
                    <div class="stat-value font-mono text-gold" id="roomTotalPool">$0</div>
                </div>
            </section>

            <!-- Tab Navigation -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="bet">投注</button>
                <button class="tab-btn" data-tab="history">我的下注</button>
            </div>

            <!-- Tab Content -->
            <div class="tab-content" id="tabContent">
                <!-- Market List (Bet Tab) -->
                <div id="betTab" class="tab-pane active">
                    <div id="marketList"></div>
                    <div id="noMarketsMsg" class="text-center text-dim my-5" style="display: none;">
                        目前沒有開放的盤口
                    </div>
                </div>
                
                <!-- My Bets (History Tab) -->
                <div id="historyTab" class="tab-pane" style="display: none;">
                    <div class="card p-0 overflow-x-auto">
                        <table class="w-100 text-left my-bets-table">
                            <thead>
                                <tr>
                                    <th>時間</th>
                                    <th>盤口</th>
                                    <th>選項</th>
                                    <th class="text-right">金額</th>
                                    <th class="text-right">賠率</th>
                                    <th class="text-center">狀態</th>
                                    <th class="text-right">損益</th>
                                </tr>
                            </thead>
                            <tbody id="myBetsTableBody">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                        <div id="noBetsMsg" class="text-center text-dim p-4" style="display: none;">
                            尚無投注紀錄
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
        
    </main>

    <footer class="text-center text-dim text-sm mt-5 mb-4 p-3">
        <p>BetPanel · 賠率隨彩池自動浮動 · 結算以您下注當下的鎖定賠率為準</p>
        <p>© 2026 包廂熱場投注系統</p>
    </footer>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script>
        // --- Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyDMq0XabHZFuOK_Olja-cqSOMDx2ygc8i4",
            authDomain: "dicebetpanel.firebaseapp.com",
            databaseURL: "https://dicebetpanel-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "dicebetpanel",
        };

        // --- State Management ---
        const ROOM_KEY = 'bp-room';
        const NAME_KEY = 'bp-name';
        const ID_KEY = 'bp-bettor-id';
        const TAB_KEY = 'bp-tab';

        let db = null;
        let firebaseReady = false;
        let currentRoom = null;
        let state = null;
        let pools = {};
        let activeTab = localStorage.getItem(TAB_KEY) || 'bet';
        let me = { id: null, name: '' };
        const draftAmounts = {};

        // --- Initialization ---
        function initApp() {
            // Generate or load Bettor ID
            me.id = localStorage.getItem(ID_KEY);
            if (!me.id) {
                me.id = 'bettor_' + Math.random().toString(36).substring(2, 9) + '_' + Date.now();
                localStorage.setItem(ID_KEY, me.id);
            }
            
            // Load Nickname
            me.name = localStorage.getItem(NAME_KEY) || '';
            document.getElementById('nicknameInput').value = me.name;
            
            // Setup Nickname listener
            document.getElementById('nicknameInput').addEventListener('input', (e) => {
                me.name = e.target.value.trim();
                localStorage.setItem(NAME_KEY, me.name);
            });

            // Initialize Firebase
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.database();
            
            // Monitor Connection
            db.ref('.info/connected').on('value', snap => {
                const connStatus = document.getElementById('connStatus');
                if (snap.val() === true) {
                    firebaseReady = true;
                    connStatus.innerHTML = '<span class="conn-dot" style="background: var(--success); box-shadow: 0 0 8px var(--success);"></span> 已連線';
                } else {
                    firebaseReady = false;
                    connStatus.innerHTML = '<span class="conn-dot" style="background: var(--danger); box-shadow: 0 0 8px var(--danger);"></span> 連線中斷';
                }
            });

            // Tab Setup
            setupTabs();

            // Check URL parameters for room joining via QR
            const urlParams = new URLSearchParams(window.location.search);
            const urlRoom = urlParams.get('room');
            if (urlRoom) {
                joinRoom(urlRoom);
                window.history.replaceState({}, document.title, window.location.pathname);
            } else {
                const savedRoom = localStorage.getItem(ROOM_KEY);
                if (savedRoom) {
                    joinRoom(savedRoom);
                } else {
                    showRoomEntry();
                }
            }
            
            // Setup Join Button
            document.getElementById('joinRoomBtn').addEventListener('click', () => {
                const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
                if (code.length > 0) {
                    joinRoom(code);
                } else {
                    showToast('請輸入包廂代碼', 'error');
                }
            });
            
            // Room code input enter key
            document.getElementById('roomCodeInput').addEventListener('keypress', (e) => {
                if(e.key === 'Enter') {
                    document.getElementById('joinRoomBtn').click();
                }
            });
        }

        // --- Room Management ---
        function showRoomEntry() {
            document.getElementById('roomEntrySection').style.display = 'block';
            document.getElementById('mainAppSection').style.display = 'none';
        }

        function showMainApp() {
            document.getElementById('roomEntrySection').style.display = 'none';
            document.getElementById('mainAppSection').style.display = 'block';
        }

        function joinRoom(roomCode) {
            roomCode = roomCode.toUpperCase();
            
            if (currentRoom) {
                db.ref(`betpanel/rooms/${currentRoom}`).off('value');
            }
            
            currentRoom = roomCode;
            localStorage.setItem(ROOM_KEY, currentRoom);
            document.getElementById('currentRoomDisplay').textContent = currentRoom;
            
            showToast(`正在進入包廂 ${currentRoom}...`);
            
            db.ref(`betpanel/rooms/${currentRoom}`).on('value', (snap) => {
                if (!snap.exists()) {
                    showToast(`包廂 ${currentRoom} 不存在或已關閉`, 'error');
                    leaveRoom();
                    return;
                }
                
                let rawState = snap.val();
                state = normalize(rawState);
                pools = buildPools(state);
                
                if (document.getElementById('roomEntrySection').style.display !== 'none') {
                    showMainApp();
                    showToast('成功加入包廂!', 'success');
                }
                
                renderAll();
            }, (error) => {
                showToast(`連線錯誤: ${error.message}`, 'error');
            });
        }

        function leaveRoom() {
            if (currentRoom) {
                db.ref(`betpanel/rooms/${currentRoom}`).off('value');
            }
            currentRoom = null;
            state = null;
            localStorage.removeItem(ROOM_KEY);
            showRoomEntry();
        }

        // --- Tabs ---
        function setupTabs() {
            const tabBtns = document.querySelectorAll('.tab-btn');
            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const targetTab = btn.getAttribute('data-tab');
                    switchTab(targetTab);
                });
            });
            switchTab(activeTab);
        }

        function switchTab(tabId) {
            activeTab = tabId;
            localStorage.setItem(TAB_KEY, activeTab);
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-tab') === tabId);
            });
            
            document.getElementById('betTab').style.display = tabId === 'bet' ? 'block' : 'none';
            document.getElementById('historyTab').style.display = tabId === 'history' ? 'block' : 'none';
            
            if (state) renderAll();
        }

        // --- Rendering ---
        function renderAll() {
            if (!state) return;
            
            renderSummary();
            
            if (activeTab === 'bet') {
                renderMarkets();
            } else if (activeTab === 'history') {
                renderMyBets();
            }
        }

        function renderSummary() {
            let openMarkets = 0;
            let totalPool = 0;
            
            if (state.markets) {
                state.markets.forEach(m => {
                    if (!m.locked && !m.settled) openMarkets++;
                });
            }
            
            state.markets.forEach(m => {
                totalPool += marketTotal(pools, m);
            });
            
            document.getElementById('roomOpenMarkets').textContent = openMarkets;
            document.getElementById('roomTotalPool').textContent = '$' + fmt(totalPool);
            
            // Personal Stats
            let myBetCount = 0;
            let myTotalStaked = 0;
            let mySettledPnL = 0;
            let myPendingAmount = 0;
            
            state.bets.forEach(b => {
                const isMe = b.bettorId === me.id || (me.name && sameNickname(b.name, me.name));
                if (isMe) {
                    myBetCount++;
                    myTotalStaked += b.amount;
                    
                    const outcome = betOutcome(state, pools, b);
                    if (outcome.status === 'pending') {
                        myPendingAmount += b.amount;
                    } else if (outcome.status === 'win' || outcome.status === 'lose') {
                        mySettledPnL += outcome.profit;
                    }
                }
            });
            
            document.getElementById('myBetCount').textContent = myBetCount;
            document.getElementById('myTotalStaked').textContent = '$' + fmt(myTotalStaked);
            
            const pnlEl = document.getElementById('mySettledPnL');
            pnlEl.textContent = (mySettledPnL > 0 ? '+' : '') + '$' + fmt(mySettledPnL);
            pnlEl.style.color = mySettledPnL > 0 ? 'var(--success)' : (mySettledPnL < 0 ? 'var(--danger)' : 'var(--text)');
            
            document.getElementById('myPendingAmount').textContent = '$' + fmt(myPendingAmount);
        }

        function renderMarkets() {
            const listEl = document.getElementById('marketList');
            const noMsg = document.getElementById('noMarketsMsg');
            
            if (!state.markets || state.markets.length === 0) {
                listEl.innerHTML = '';
                noMsg.style.display = 'block';
                return;
            }
            
            noMsg.style.display = 'none';
            
            const marketArr = [...state.markets].sort((a, b) => {
                const statusA = a.settled ? 3 : (a.locked ? 2 : 1);
                const statusB = b.settled ? 3 : (b.locked ? 2 : 1);
                if (statusA !== statusB) return statusA - statusB;
                return (b.createdAt || 0) - (a.createdAt || 0);
            });
            
            let html = '';
            marketArr.forEach(m => {
                html += renderMarketCard(m);
            });
            
            listEl.innerHTML = html;
        }

        function renderMarketCard(m) {
            const totalPool = marketTotal(pools, m);
            const isSettled = !!m.settled;
            const isLocked = !!m.locked;
            const isOpen = !isSettled && !isLocked;
            
            let statusBadge = '';
            if (isOpen) statusBadge = '<span class="badge badge-success" style="background:rgba(0,255,136,0.15); color:#00ff88; padding:3px 8px; border-radius:4px; font-size:12px;">開放投注</span>';
            else if (isLocked) statusBadge = '<span class="badge badge-warning" style="background:rgba(255,204,0,0.15); color:#ffcc00; padding:3px 8px; border-radius:4px; font-size:12px;">已鎖定</span>';
            else if (isSettled) statusBadge = '<span class="badge badge-dim" style="background:rgba(255,255,255,0.1); color:#aaa; padding:3px 8px; border-radius:4px; font-size:12px;">已結算</span>';
            
            let html = `
                <div class="card market-card mb-4 ${isSettled ? 'settled-card' : ''}" id="market-${m.id}" style="background:#13131c; border:1px solid #222; border-radius:8px; padding:15px; margin-bottom:15px;">
                    <div class="market-header d-flex justify-content-between align-items-start mb-3" style="display:flex; justify-content:space-between;">
                        <div>
                            <h3 class="market-title m-0" style="font-size:18px; margin:0;">${esc(m.title)}</h3>
                            ${m.desc ? `<p class="text-sm text-dim mt-1 mb-0" style="font-size:12px; color:#aaa; margin-top:4px;">${esc(m.desc)}</p>` : ''}
                        </div>
                        <div class="text-right" style="text-align:right;">
                            ${statusBadge}
                            ${m.rake > 0 ? `<div class="text-xs text-dim mt-1" style="font-size:11px; color:#888;">抽水: ${m.rake}%</div>` : ''}
                        </div>
                    </div>
                    
                    <div class="market-options mb-3">
            `;
            
            m.options.forEach((opt) => {
                const isWinner = isSettled && m.winnerId === opt.id;
                const poolAmt = poolOf(pools, m.id, opt.id);
                const poolPercent = totalPool > 0 ? (poolAmt / totalPool) * 100 : 0;
                
                const oddsObj = liveOdds(pools, m, opt.id);
                const oddsVal = oddsObj.value.toFixed(2);
                
                html += `
                    <div class="option-row ${isWinner ? 'winner' : ''} mb-2 p-2" style="border: 1px solid ${isWinner ? '#00ff88' : '#2a2a38'}; border-radius: 6px; position: relative; overflow: hidden; margin-bottom:8px; padding:10px; background:#1a1a26;">
                        <div style="position: absolute; left: 0; bottom: 0; height: 3px; background: #00f0ff; width: ${poolPercent}%; opacity: 0.5; transition: width 0.3s;"></div>
                        
                        <div class="d-flex justify-content-between align-items-center" style="display:flex; justify-content:space-between; align-items:center;">
                            <div class="font-weight-bold" style="font-size: 1.1rem; font-weight:bold; color:#fff;">
                                ${esc(opt.label)} ${isWinner ? '👑 獲勝' : ''}
                            </div>
                            <div class="text-right" style="text-align:right;">
                                <div class="font-mono text-gold" style="font-size: 1.3rem; font-weight: bold; color: #ffd700;">x${oddsVal}</div>
                                <div class="text-xs text-dim" style="font-size:11px; color:#aaa;">池: $${fmt(poolAmt)}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            html += `</div>`;
            
            if (isOpen) {
                const currentDraft = draftAmounts[m.id] || '';
                html += `
                    <div class="bet-form-container pt-2" style="border-top: 1px solid #222; padding-top:10px;">
                        <div class="form-group mb-2">
                            <label style="font-size:12px; color:#aaa; display:block; margin-bottom:4px;">選擇投注選項</label>
                            <select id="sel-${m.id}" class="form-control mb-2" style="width:100%; padding:8px; background:#0b0b10; color:#fff; border:1px solid #333; border-radius:4px;">
                                <option value="">-- 請選擇 --</option>
                                ${m.options.map(opt => `<option value="${opt.id}">${esc(opt.label)} (目前 x${liveOdds(pools, m, opt.id).value.toFixed(2)})</option>`).join('')}
                            </select>
                        </div>
                        
                        <div class="form-group mb-2">
                            <label style="font-size:12px; color:#aaa; display:block; margin-bottom:4px;">下注金額</label>
                            <input type="number" id="amt-${m.id}" class="form-control mb-2" placeholder="輸入金額..." value="${currentDraft}" oninput="draftAmounts['${m.id}'] = this.value" style="width:100%; padding:8px; background:#0b0b10; color:#fff; border:1px solid #333; border-radius:4px;">
                        </div>
                        
                        <div class="quick-amounts d-flex gap-1 mb-3" style="display:flex; gap:6px; margin-bottom:10px;">
                            ${QUICK_AMOUNTS.map(amt => `<button type="button" class="btn btn-sm btn-outline flex-1" onclick="addAmount('${m.id}', ${amt})" style="flex:1; padding:6px 0; background:#222; border:1px solid #444; color:#fff; border-radius:4px; font-size:12px;">+${amt}</button>`).join('')}
                            <button type="button" class="btn btn-sm btn-outline flex-1 text-danger" onclick="setAmount('${m.id}', 5000)" style="flex:1; padding:6px 0; background:#331111; border:1px solid #ff3366; color:#ff3366; border-radius:4px; font-size:12px;">$5000</button>
                        </div>
                        
                        <button class="btn btn-primary w-100 py-2" onclick="placeBet('${m.id}')" style="width:100%; padding:10px; background:linear-gradient(135deg, #ffd700, #ffaa00); color:#000; font-weight:bold; border:none; border-radius:4px; cursor:pointer;">確認下注</button>
                    </div>
                `;
            }
            
            html += `</div>`;
            return html;
        }

        function renderMyBets() {
            const tbody = document.getElementById('myBetsTableBody');
            const noMsg = document.getElementById('noBetsMsg');
            
            const myBets = state.bets.filter(b => b.bettorId === me.id || (me.name && sameNickname(b.name, me.name)));
            
            if (myBets.length === 0) {
                tbody.innerHTML = '';
                noMsg.style.display = 'block';
                return;
            }
            
            noMsg.style.display = 'none';
            
            let html = '';
            myBets.reverse().forEach(b => {
                const m = state.markets.find(x => x.id === b.marketId);
                const mTitle = m ? m.title : '未知盤口';
                
                const opt = m ? m.options.find(o => o.id === b.optionId) : null;
                const optLabel = opt ? opt.label : b.optionId;
                
                const outcome = betOutcome(state, pools, b);
                
                let statusBadge = '';
                let pnlStr = '$0';
                let pnlClass = '';
                
                if (outcome.status === 'pending') {
                    statusBadge = '<span style="color:#ffcc00;">待開</span>';
                    pnlStr = '-';
                } else if (outcome.status === 'win') {
                    statusBadge = '<span style="color:#00ff88; font-weight:bold;">中獎</span>';
                    pnlStr = '+' + fmt(outcome.profit);
                    pnlClass = 'color:#00ff88; font-weight:bold;';
                } else if (outcome.status === 'lose') {
                    statusBadge = '<span style="color:#888;">未中</span>';
                    pnlStr = '-' + fmt(b.amount);
                    pnlClass = 'color:#ff3366;';
                }
                
                const timeStr = new Date(b.ts || Date.now()).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
                
                html += `
                    <tr style="border-bottom:1px solid #222;">
                        <td style="padding:8px; font-size:12px; color:#888;">${timeStr}</td>
                        <td style="padding:8px; font-size:13px;">${esc(mTitle)}</td>
                        <td style="padding:8px; font-size:13px; color:#00f0ff;">${esc(optLabel)}</td>
                        <td style="padding:8px; font-size:13px; text-align:right;">$${fmt(b.amount)}</td>
                        <td style="padding:8px; font-size:13px; text-align:right; color:#ffd700;">x${betOdds(b).toFixed(2)}</td>
                        <td style="padding:8px; font-size:13px; text-align:center;">${statusBadge}</td>
                        <td style="padding:8px; font-size:13px; text-align:right; ${pnlClass}">$${pnlStr}</td>
                    </tr>
                `;
            });
            
            tbody.innerHTML = html;
        }

        function addAmount(marketId, amt) {
            const input = document.getElementById(`amt-${marketId}`);
            if (!input) return;
            const current = parseInt(input.value) || 0;
            input.value = current + amt;
            draftAmounts[marketId] = input.value;
        }

        function setAmount(marketId, amt) {
            const input = document.getElementById(`amt-${marketId}`);
            if (!input) return;
            input.value = amt;
            draftAmounts[marketId] = input.value;
        }

        async function placeBet(marketId) {
            if (!firebaseReady || !currentRoom) {
                showToast('尚未連線至包廂', 'error');
                return;
            }
            
            if (!me.name) {
                showToast('請先在上方輸入您的暱稱', 'error');
                document.getElementById('nicknameInput').focus();
                return;
            }
            
            const selEl = document.getElementById(`sel-${marketId}`);
            const amtEl = document.getElementById(`amt-${marketId}`);
            
            const optionId = selEl.value;
            if (!optionId) {
                showToast('請選擇投注選項', 'warning');
                return;
            }
            
            const amount = parseInt(amtEl.value);
            if (isNaN(amount) || amount <= 0) {
                showToast('請輸入有效金額', 'warning');
                return;
            }
            
            const m = state.markets.find(x => x.id === marketId);
            if (!m) return;
            
            if (m.locked || m.settled) {
                showToast('盤口已關閉或結算', 'error');
                return;
            }

            try {
                const freshSnap = await db.ref(`betpanel/rooms/${currentRoom}`).once('value');
                const freshRaw = freshSnap.val();
                if (!freshRaw) throw new Error("Room data missing");
                
                const freshState = normalize(freshRaw);
                const freshM = freshState.markets.find(x => x.id === marketId);
                
                if (!freshM || freshM.locked || freshM.settled) {
                    showToast('下注失敗：盤口已關閉或結算', 'error');
                    return;
                }
                
                // Validate amount
                const valRes = validateBetAmount(amount, effectiveMaxBet(freshState, freshM));
                if (!valRes.ok) {
                    showToast(valRes.reason, 'error');
                    return;
                }
                
                // Calculate odds at bet time
                const freshPools = buildPools(freshState);
                const oddsObj = liveOdds(freshPools, freshM, optionId);
                const lockedOdds = oddsObj.value;
                
                const newBet = {
                    marketId: marketId,
                    optionId: optionId,
                    name: me.name,
                    bettorId: me.id,
                    amount: amount,
                    oddsAtBet: lockedOdds,
                    ts: firebase.database.ServerValue.TIMESTAMP
                };
                
                await db.ref(`betpanel/rooms/${currentRoom}/bets`).push(newBet);
                
                showToast(`投注成功! 鎖定賠率 x${lockedOdds.toFixed(2)}`, 'success');
                
                selEl.value = "";
                amtEl.value = "";
                draftAmounts[marketId] = "";
                
            } catch (err) {
                console.error(err);
                showToast('網路錯誤，下注失敗', 'error');
            }
        }

        // --- Toast System ---
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = msg;
            toast.style.background = type === 'error' ? '#ff3366' : (type === 'success' ? '#00ff88' : '#222');
            toast.style.color = type === 'success' ? '#000' : '#fff';
            toast.style.padding = '10px 15px';
            toast.style.borderRadius = '6px';
            toast.style.marginBottom = '8px';
            toast.style.boxShadow = '0 4px 12px rgba(0,0,0,0.5)';
            
            container.appendChild(toast);
            
            setTimeout(() => {
                if(toast.parentNode) toast.parentNode.removeChild(toast);
            }, 3000);
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
